version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiwf-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiwf_dev}
      POSTGRES_USER: ${POSTGRES_USER:-aiwf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiwf_user} -d ${POSTGRES_DB:-aiwf_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiwf-internal-network

  redis:
    image: redis:7.2-alpine
    container_name: aiwf-redis-dev
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aiwf-internal-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: aiwf-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aiwf-internal-network

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: aiwf-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio_admin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio_password_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aiwf-internal-network

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aiwf-mailhog-dev
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - aiwf-internal-network

networks:
  aiwf-internal-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
